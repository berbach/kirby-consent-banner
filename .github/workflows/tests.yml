name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / Kirby ${{ matrix.kirby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', kirby: '5' }
          - { php: '8.3', kirby: '5' }
          - { php: '8.4', kirby: '5' }
          - { php: '8.3', kirby: '6' }
          - { php: '8.4', kirby: '6' }

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, gd, curl
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Kirby 6
        if: matrix.kirby == '6'
        run: composer require --dev "getkirby/cms:^6.0" --with-all-dependencies --no-progress

      - name: Lint PHP files
        run: find index.php src snippets translations tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: composer test

  assets:
    name: Built assets are up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build

      # assets/dist is committed: a change in resources/ needs a new build
      - name: Compare with the committed build
        run: git diff --exit-code -- assets/dist

# A component: one service the visitor agrees to, with its integration type
# and the cookie information.
title: berbach.consent-banner.blueprint.component
icon: toggle-on
num: default

options:
  changeTemplate: false
  preview: false

# A draft is left out of the banner
status:
  draft:
    label: berbach.consent-banner.status.draft
    text: berbach.consent-banner.status.component.draft.text
  listed:
    label: berbach.consent-banner.status.active
    text: berbach.consent-banner.status.component.active.text

tabs:
  general:
    label: berbach.consent-banner.tab.general
    icon: text
    fields:
      component_description:
        label: berbach.consent-banner.field.component_description
        type: textarea
        buttons: false
        size: small

  integration:
    label: berbach.consent-banner.tab.integration
    icon: code
    fields:
      integration_type:
        label: berbach.consent-banner.field.integration_type
        help: berbach.consent-banner.field.integration_type.help
        type: select
        default: iframe
        required: true
        translate: false
        options:
          iframe: berbach.consent-banner.field.integration_type.iframe
          google_consent_mode: berbach.consent-banner.field.integration_type.google_consent_mode
          matomo: berbach.consent-banner.field.integration_type.matomo
          script: berbach.consent-banner.field.integration_type.script
      component_target:
        label: berbach.consent-banner.field.component_target
        help: berbach.consent-banner.field.component_target.help
        type: tags
        translate: false
        when:
          integration_type: iframe
      consent_mode_signals:
        label: berbach.consent-banner.field.consent_mode_signals
        help: berbach.consent-banner.field.consent_mode_signals.help
        type: checkboxes
        columns: 2
        translate: false
        options:
          - analytics_storage
          - ad_storage
          - ad_user_data
          - ad_personalization
          - functionality_storage
          - personalization_storage
          - security_storage
        when:
          integration_type: google_consent_mode

  javascript:
    label: berbach.consent-banner.tab.javascript
    icon: terminal
    fields:
      javascript_info:
        label: berbach.consent-banner.tab.javascript
        type: info
        text: berbach.consent-banner.field.javascript.info
      accepted_script:
        label: berbach.consent-banner.field.accepted_script
        help: berbach.consent-banner.field.accepted_script.help
        type: textarea
        buttons: false
        font: monospace
        spellcheck: false
        size: large
        translate: false
      rejected_script:
        label: berbach.consent-banner.field.rejected_script
        help: berbach.consent-banner.field.rejected_script.help
        type: textarea
        buttons: false
        font: monospace
        spellcheck: false
        size: medium
        translate: false

  placeholder:
    label: berbach.consent-banner.tab.placeholder
    icon: image
    fields:
      placeholder_title:
        label: berbach.consent-banner.field.placeholder_title
        help: berbach.consent-banner.field.placeholder_title.help
        type: text
      placeholder_description:
        label: berbach.consent-banner.field.placeholder_description
        type: textarea
        buttons: false
        size: small

  cookies:
    label: berbach.consent-banner.tab.cookie_information
    icon: info-card
    fields:
      service_name:
        label: berbach.consent-banner.field.service_name
        help: berbach.consent-banner.field.service_name.description
        type: consentservice
        icon: search
      service_provider:
        label: berbach.consent-banner.field.service_provider
        type: text
        width: 1/2
        translate: false
      service_publisher:
        label: berbach.consent-banner.field.service_publisher
        type: text
        width: 1/2
      service_privacy_link:
        label: berbach.consent-banner.field.service_privacy_link
        type: link
        options:
          - url
          - page
      service_data_collected:
        label: berbach.consent-banner.field.service_data_collected
        type: textarea
        buttons: false
        size: small
      cookies:
        label: berbach.consent-banner.field.cookies
        type: structure
        columns:
          cookie_name:
            width: 1/3
          cookie_type:
            width: 1/6
          cookie_purpose:
            width: 1/4
          cookie_lifetime:
            width: 1/4
        fields:
          cookie_name:
            label: berbach.consent-banner.field.cookie_name
            type: text
            required: true
            width: 1/2
          cookie_type:
            label: berbach.consent-banner.field.cookie_type
            help: berbach.consent-banner.field.cookie_type.help
            type: text
            width: 1/2
          cookie_purpose:
            label: berbach.consent-banner.field.cookie_purpose
            type: text
            width: 1/2
          cookie_lifetime:
            label: berbach.consent-banner.field.cookie_lifetime
            type: text
            width: 1/2
          cookie_description:
            label: berbach.consent-banner.field.cookie_description
            type: textarea
            buttons: false
            size: small

# A group of the banner, e.g. "Essential" or "Analytics". Its components are
# children.
title: berbach.consent-banner.blueprint.group
icon: layers
num: default

options:
  changeTemplate: false
  move: false
  preview: false

# A draft is left out of the banner
status:
  draft:
    label: berbach.consent-banner.status.draft
    text: berbach.consent-banner.status.group.draft.text
  listed:
    label: berbach.consent-banner.status.active
    text: berbach.consent-banner.status.group.active.text

columns:
  main:
    width: 2/3
    sections:
      fields:
        type: fields
        fields:
          group_description:
            label: berbach.consent-banner.field.group_description
            type: textarea
            buttons: false
            size: small
      components:
        label: berbach.consent-banner.field.group_components
        help: berbach.consent-banner.field.group_components.help
        type: pages
        templates: consent-banner-component
        status: all
        info: "{{ page.service_name }}"
        image: false
  side:
    width: 1/3
    sections:
      settings:
        type: fields
        fields:
          group_essential:
            label: berbach.consent-banner.field.group_essential
            help: berbach.consent-banner.field.group_essential.help
            type: toggle
            default: false
            translate: false
            text:
              - berbach.consent-banner.toggle.no
              - berbach.consent-banner.toggle.yes
